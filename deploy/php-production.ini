; VVU DTS: PHP 8.3 settings for production.
; CloudPanel: Site → PHP Settings (fields + "Additional configuration directives").
; Plain Ubuntu: copy to /etc/php/8.3/fpm/conf.d/99-vvu-dts.ini and /etc/php/8.3/cli/conf.d/,
; then `systemctl reload php8.3-fpm`.

date.timezone = Africa/Accra

; Attachments: 10 MB each (Admin → Settings "max upload size" must not exceed this), up to 5 per upload.
upload_max_filesize = 10M
post_max_size = 55M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Never show errors to visitors; the app logs to storage/logs/app.log.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Sessions: the app sets HttpOnly/Secure/SameSite itself; these are safe defaults.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200

; Performance
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
realpath_cache_size = 4096K

; Required extensions: pdo_mysql, mbstring, fileinfo, openssl, zip (DOCX/XLSX checks); gd optional.
