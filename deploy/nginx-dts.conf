# VVU Document Tracking System: Nginx server block (Ubuntu + PHP 8.3-FPM).
#
# CloudPanel: create a "PHP Site" for the domain, set Site → Settings → Root Directory to
# ".../public", then paste the "location" blocks below into Site → Vhost, replacing the
# generic PHP location (keep CloudPanel's own ssl/listen lines and its fastcgi_pass port).
#
# Plain Nginx: copy to /etc/nginx/sites-available/dts.vvu.edu.gh, adjust paths and
# server_name, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name dts.vvu.edu.gh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dts.vvu.edu.gh;

    # Let's Encrypt (certbot --nginx) or a Cloudflare Origin Certificate.
    ssl_certificate     /etc/letsencrypt/live/dts.vvu.edu.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dts.vvu.edu.gh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only public/ is served. .env, storage/, vendor/, app/ etc. sit one level up and are unreachable.
    root /home/vvu-dts/htdocs/dts.vvu.edu.gh/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # 5 attachments x 10 MB per upload, plus form fields. Keep in step with php.ini post_max_size.
    client_max_body_size 55M;

    # --- Real visitor IP when behind Cloudflare (needed for login/tracking rate limits) ---
    # Current ranges: https://www.cloudflare.com/ips/ (review occasionally).
    # set_real_ip_from 173.245.48.0/20;   set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;   set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;   set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;   set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;  set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;    set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;     set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # set_real_ip_from 2400:cb00::/32;    set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;    set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;    set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;

    # Hidden files (.htaccess, .git, ...) except ACME challenges.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Static assets: long cache; versioned by ?v= in the HTML. Security headers here because
    # PHP responses already send their own (adding them twice would duplicate them).
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Everything else goes to the front controller.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # CloudPanel: 127.0.0.1:<php-fpm port>
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;                       # TLS ends here (or at Cloudflare): tells PHP the site is HTTPS
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file may be executed.
    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/dts.access.log;
    error_log  /var/log/nginx/dts.error.log warn;
}
